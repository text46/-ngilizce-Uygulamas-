<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Koyu Obsidyen Zemin Gradyanı -->
    <radialGradient id="darkBgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2027" />
      <stop offset="100%" stop-color="#0c0d10" />
    </radialGradient>

    <!-- Beyaz / Platin Çubuklar Gradyanı (E Harfi) -->
    <linearGradient id="whiteBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Üst Kenar Işık Yansıması (Bevel / Specular Highlight) -->
    <linearGradient id="specularHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Derinlik Veren İnce Alt Gölge -->
    <filter id="barDepthShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Siyah / Koyu Obsidyen Arka Plan (Squircle Köşeler) -->
  <rect width="512" height="512" rx="128" fill="url(#darkBgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- 1. ÜST ÇUBUK -->
  <g filter="url(#barDepthShadow)">
    <rect x="96" y="128" width="320" height="64" rx="32" fill="url(#whiteBarGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <rect x="97" y="129" width="318" height="62" rx="31" fill="none" stroke="url(#specularHi)" stroke-width="1.5" />
  </g>

  <!-- 2. ORTA ÇUBUK -->
  <g filter="url(#barDepthShadow)">
    <rect x="96" y="224" width="208" height="64" rx="32" fill="url(#whiteBarGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <rect x="97" y="225" width="206" height="62" rx="31" fill="none" stroke="url(#specularHi)" stroke-width="1.5" />
  </g>

  <!-- 3. ALT ÇUBUK -->
  <g filter="url(#barDepthShadow)">
    <rect x="96" y="320" width="320" height="64" rx="32" fill="url(#whiteBarGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <rect x="97" y="321" width="318" height="62" rx="31" fill="none" stroke="url(#specularHi)" stroke-width="1.5" />
  </g>
</svg>
