<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian / Black Background with Subtle Purple Core Glow -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="55%" stop-color="#0a0414" />
      <stop offset="100%" stop-color="#040108" />
    </radialGradient>

    <!-- Bar Drop Shadow with Purple Ambient Glow -->
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Bar Vibrant Amethyst Purple Gradient -->
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Top Bevel Highlight Specular Reflection -->
    <linearGradient id="barHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- 1. TOP BAR -->
  <g filter="url(#barShadow)">
    <rect x="96" y="128" width="320" height="64" rx="32" fill="url(#barFill)" />
    <rect x="97" y="129" width="318" height="62" rx="31" fill="none" stroke="url(#barHi)" stroke-width="2" />
  </g>

  <!-- 2. MIDDLE BAR -->
  <g filter="url(#barShadow)">
    <rect x="96" y="224" width="208" height="64" rx="32" fill="url(#barFill)" />
    <rect x="97" y="225" width="206" height="62" rx="31" fill="none" stroke="url(#barHi)" stroke-width="2" />
  </g>

  <!-- 3. BOTTOM BAR -->
  <g filter="url(#barShadow)">
    <rect x="96" y="320" width="320" height="64" rx="32" fill="url(#barFill)" />
    <rect x="97" y="321" width="318" height="62" rx="31" fill="none" stroke="url(#barHi)" stroke-width="2" />
  </g>
</svg>